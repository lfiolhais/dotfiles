# Cross-OS package manifest -- what gets installed, and what does not.
#
# macOS installs from private_dot_config/Brewfile. This file maps each Brewfile
# formula onto its Linux equivalent so the Linux profiles stay in step, and
# records the reason for every formula that is deliberately not ported.
#
# THE RULE: if a tool is not in the system's package manager, it is not
# installed. No release downloads, no vendored installers. The only exceptions
# are gh and starship, which the 01 script installs from their own repo and
# installer because neither is in any base repo.
#
# Targets:
#   apt     Debian / Ubuntu / Pop!_OS
#   fedora  Fedora
#   el      RHEL rebuilds (Rocky / Alma / CentOS Stream 9) with EPEL + CRB
#   mise    the rootless no-sudo profile, where mise IS the package manager --
#           so a tool can be mise-only, available there and nowhere else
#
# A missing field means "not available on that target": the name is left out of
# that distro's install list. `note` records why, when the absence is surprising.
#
# To add, remove, or look up a package, use tests/packages.py -- see the Packages
# section of README.md. Do not hand-edit if you can avoid it: the field order
# below is what that script writes and what tests/check.py checks.


